name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx ng build --base-href /physio-clinic-website/

      - name: Prepare output
        run: |
          if [ -d dist/frontend/browser ]; then OUT=dist/frontend/browser; else OUT=dist/frontend; fi
          cp $OUT/index.html $OUT/404.html
          touch $OUT/.nojekyll
          echo "OUT=$OUT" >> $GITHUB_ENV

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/${{ env.OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
